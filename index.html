<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Tutorial with Code Playground</title>
</head>
<body>
  <table border="1" width="100%" height="100%">
    <tr>
      <!-- Tutorial Section -->
      <td width="50%" valign="top">
        <article>
          <h1>HTML Basics Tutorial</h1>
          <p>This tutorial explains how to create a simple HTML page.</p>
          <h2>Example Code:</h2>
          <pre>
&lt;h1&gt;Hello World&lt;/h1&gt;
&lt;p&gt;This is a paragraph.&lt;/p&gt;
          </pre>
          <p>Edit the code on the right and click "Run Code" to see output.</p>
        </article>
      </td>
      <!-- Code Playground -->
      <td width="50%" valign="top">
        <h2>Code Editor</h2>
        <textarea id="code" rows="15" cols="60">
<h1>Hello World</h1>
<p>This is a paragraph.</p>
        </textarea>
        <br><br>
        <button onclick="runCode()">Run Code</button>
        <h3>Output:</h3>
        <iframe id="output" width="100%" height="200"></iframe>\
      </td>
    </tr>
  </table>
  <script>
    function runCode() {
      var code = document.getElementById("code").value;
      document.getElementById("output").srcdoc = code;
    }
  </script>
</body>
</html>
